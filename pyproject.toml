[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), bugbear (B), ruff (RUF).
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",  # line length handled by formatter; keep narrative strings readable
]

[tool.ruff.lint.per-file-ignores]
# Streamlit entry scripts and the test bootstrap insert sys.path before imports.
"app/Home.py" = ["E402"]
"app/pages/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RingSight — clickable mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1E3A8A; --primary-ink:#ffffff; --accent:#0EA5E9;
  --high:#DC2626; --med:#F59E0B; --low:#16A34A;
  --bad-bg:#FEE2E2; --bad-ink:#B91C1C; --ok-bg:#DCFCE7; --ok-ink:#166534;
  --surface:#F8FAFC; --panel:#FFFFFF; --side:#EEF2F7; --ink:#0F172A; --muted:#64748B;
  --line:#E2E8F0; --chip:#E0F2FE; --chip-ink:#075985; --hover:#F1F5F9;
  --shadow:0 1px 2px rgba(15,23,42,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#3B5BCC; --surface:#0B1220; --panel:#111A2E; --side:#0E1628; --ink:#E2E8F0; --muted:#94A3B8;
    --line:#22304A; --chip:#0C3048; --chip-ink:#7DD3FC; --hover:#17223A; --bad-bg:#3B1219; --bad-ink:#FCA5A5;
    --ok-bg:#0F2E1C; --ok-ink:#86EFAC; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --primary:#3B5BCC; --surface:#0B1220; --panel:#111A2E; --side:#0E1628; --ink:#E2E8F0; --muted:#94A3B8;
  --line:#22304A; --chip:#0C3048; --chip-ink:#7DD3FC; --hover:#17223A; --bad-bg:#3B1219; --bad-ink:#FCA5A5;
  --ok-bg:#0F2E1C; --ok-ink:#86EFAC; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--surface);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;height:100%}
/* sidebar */
.sidebar{background:var(--side);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-weight:500;color:var(--ink)}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--panel);box-shadow:var(--shadow);color:var(--primary)}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:#A5B8F5}
.sidegroup{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.sidegroup h4{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--ok-bg);color:var(--ok-ink)}
.pill.mock{background:#FEF3C7;color:#92400E}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--high)}
.switch input:checked::after{left:16px}
/* main */
main{overflow-y:auto;min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .crumbs{color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.btn.menu-btn{display:none}
.view{padding:24px 28px 60px;max-width:1280px}
h1{font-size:26px;line-height:1.25;margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:2fr 3fr;gap:16px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--high);border-color:#FCA5A5}
.btn.ok{background:var(--low);border-color:var(--low);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.big{padding:13px 22px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums}
.score i{width:10px;height:10px;border-radius:2px;display:inline-block}
.status{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--hover);white-space:nowrap}
.status.Approved{background:var(--ok-bg);color:var(--ok-ink)}
.status.Rejected{background:var(--bad-bg);color:var(--bad-ink)}
.status.InReview{background:#E0E7FF;color:#3730A3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .status.InReview{background:#1E2A5A;color:#C7D2FE}}
:root[data-theme="dark"] .status.InReview{background:#1E2A5A;color:#C7D2FE}
.tag{font-size:12px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);white-space:nowrap;margin-right:4px}
.mono{white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--panel);color:var(--ink);min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.note{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--primary);width:0;transition:width .5s ease}
/* investigate */
.inv-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.inv-grid{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.graphbox{position:relative;height:430px;padding:0;overflow:hidden}
.graphbox svg{width:100%;height:100%;display:block;touch-action:none}
.graphlegend{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;background:var(--panel);padding:4px 8px;border-radius:6px}
.graphlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.node{cursor:grab}
.node:active{cursor:grabbing}
.why li{margin:0 0 8px;list-style:none;display:flex;gap:10px}
.why ul{padding:0;margin:0}
.why .pts{font-weight:700;color:var(--high);min-width:38px;font-variant-numeric:tabular-nums}
.tooltip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:7px 10px;border-radius:6px;max-width:300px;z-index:50;opacity:0;transition:opacity .1s;line-height:1.4}
/* SAR */
.sar-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.gscore{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;font-weight:700;font-size:15px}
.gscore.ok{background:var(--ok-bg);color:var(--ok-ink)}
.gscore.bad{background:var(--bad-bg);color:var(--bad-ink)}
.sec{margin:18px 0 6px;font-size:14px;font-weight:700;color:var(--primary)}
:root[data-theme="dark"] .sec{color:#A5B8F5}
.sent{padding:7px 10px;border-radius:7px;margin:2px 0;display:flex;gap:10px;align-items:flex-start}
.sent .txt{flex:1;max-width:78ch}
.sent.bad{background:var(--bad-bg)}
.sent.bad .txt{color:var(--bad-ink)}
.sent .mark{font-weight:700;width:16px;flex:none;text-align:center}
.sent.ok .mark{color:var(--low)}
.sent.bad .mark{color:var(--high)}
.issues{font-size:12.5px;margin-top:3px}
.chip{all:unset;cursor:pointer;display:inline-block;font-size:11.5px;font-weight:600;padding:0 6px;border-radius:4px;background:var(--chip);color:var(--chip-ink);margin-left:3px;line-height:18px;font-variant-numeric:tabular-nums}
.chip:hover{outline:1px solid var(--accent)}
tr.flash td{background:var(--chip) !important;transition:background .3s}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:center}
.steps .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .7s linear infinite}
.steps li.done .dot{background:var(--low);border-color:var(--low)}
.steps li.warn .dot{background:var(--med);border-color:var(--med)}
@keyframes spin{to{transform:rotate(360deg)}}
.edit-sent{display:grid;grid-template-columns:1fr 120px auto;gap:6px;margin:4px 0}
.edit-sent textarea{min-height:44px;resize:vertical}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-width:760px}
.msg{padding:9px 12px;border-radius:10px;max-width:85%}
.msg.u{align-self:flex-end;background:var(--primary);color:#fff}
.msg.a{align-self:flex-start;background:var(--hover)}
.sugg{all:unset;cursor:pointer;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:40;overflow-y:auto;padding:30px 12px}
.modal.open{display:flex}
.paper{--panel:#fff;--ink:#111827;--muted:#64748B;--line:#E5E7EB;background:#fff;color:#111827;width:min(760px,100%);padding:42px 48px;position:relative;border-radius:4px;font-size:13.5px;box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden}
.paper h3{margin:18px 0 6px;font-size:14px;color:#1E3A8A}
.paper .wm{position:absolute;top:38%;left:-10%;right:-10%;text-align:center;font-size:64px;font-weight:800;color:rgba(220,38,38,.12);transform:rotate(-24deg);pointer-events:none;white-space:nowrap}
.paper table td,.paper table th{border-color:#E5E7EB;padding:5px 6px;font-size:12px;color:#111827}
.paper sup{color:#0369A1;font-size:9.5px}
.paper .box{border:1px solid #CBD5E1;border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:12.5px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* wireframe mode */
body.wire .app{filter:grayscale(1)}
body.wire .card,body.wire .btn,body.wire .kpi,body.wire .sent,body.wire table,body.wire .graphbox{border-style:dashed !important;box-shadow:none !important}
body.wire .btn.primary{background:var(--panel);color:var(--ink);border:2px solid var(--ink)}
body.wire .kpi .v,body.wire h1{font-family:"Comic Sans MS","Chalkboard SE",ui-rounded,sans-serif}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.inv-grid,.grid2{grid-template-columns:minmax(0,1fr)}}
.grid2>*,.inv-grid>*{min-width:0}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .btn.menu-btn{display:inline-flex}
  .topbar{padding:10px 16px;top:env(safe-area-inset-top,0px)}
  .view{padding:18px 16px 50px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .paper{padding:28px 20px}
  .edit-sent{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#1E3A8A" stroke-width="2.5"/><circle cx="17" cy="5" r="3.2" fill="#DC2626"/><circle cx="29" cy="17" r="3.2" fill="#DC2626"/><circle cx="17" cy="29" r="3.2" fill="#DC2626"/><circle cx="5" cy="17" r="3.2" fill="#DC2626"/><circle cx="17" cy="17" r="4" fill="#0EA5E9"/></svg>

      <button data-page="investigate">Investigate</button>

  <main id="main">

      <div class="seg" role="group" aria-label="Fidelity">
        <button id="hifiBtn" aria-pressed="true">Hi-fi</button>
        <button id="wireBtn" aria-pressed="false">Wireframe</button>
      </div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="tooltip" id="tip"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="SAR PDF preview"></div>

<script>

function validateSentence(text,ids){
  const issues=[]; const ev=ids.map(i=>EV.find(e=>e.id===i));
  if(!ids.length) issues.push("no evidence_ids");
  ids.forEach((i,k)=>{ if(!ev[k]) issues.push(`unknown evidence id ${i}`); });
  const cited=ev.filter(Boolean);
  const accs=new Set(cited.flatMap(e=>e.acc)), amts=cited.flatMap(e=>e.amt), dates=cited.flatMap(e=>e.dates).sort(), txs=new Set(cited.flatMap(e=>e.tx));
  (text.match(/ACC_\d{4}/g)||[]).forEach(a=>{ if(!accs.has(a)) issues.push(`${a} not in cited evidence`); });
  (text.match(/T\d{6}/g)||[]).forEach(t=>{ if(!txs.has(t)) issues.push(`${t} not in cited evidence`); });
  (text.match(/\d{1,3}(?:,\d{3})*\.\d{2} USD/g)||[]).forEach(m=>{ const v=parseFloat(m.replace(/,|USD/g,""));
    if(!amts.some(a=>Math.abs(a-v)<=a*0.01)) issues.push(`${m} does not match cited evidence (±1%)`); });
  (text.match(/\d{4}-\d{2}-\d{2}/g)||[]).forEach(d=>{ if(!dates.length||d<dates[0]||d>dates[dates.length-1]) issues.push(`date ${d} outside cited evidence dates`); });
  const low=text.toLowerCase(); LEXICON.forEach(w=>{ if(low.includes(w)) issues.push(`speculation: “${w}”`); });
  return issues;
}
function validateAll(){
  let n=0,ok=0;
  for(const k in S.narr){ S.narr[k].forEach(s=>{ s.issues=validateSentence(s.text,s.ids); n++; if(!s.issues.length) ok++; }); }
  return n?Math.round(ok/n*1000)/10:0;
}
function freshNarr(){
  const o={}; for(const k in NARR0) o[k]=NARR0[k].map(([text,ids])=>({text,ids:[...ids]}));
  if(S.inject) o.activity.splice(2,0,{text:FAKE[0],ids:[...FAKE[1]],fake:true});

}

  g.edges.forEach(([a,b,amt,dt,ev,sus])=>{ const A=pos[a],B=pos[b]; const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1; const ra=rad(A)+2, rb=rad(B)+5;
    const x1=A.x+dx/L*ra,y1=A.y+dy/L*ra,x2=B.x-dx/L*rb,y2=B.y-dy/L*rb; const col=sus===1?"var(--high)":sus===2?"var(--med)":"var(--muted)";
    out+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sus?2.4:1.2}" ${sus?`marker-end="url(#${sus===1?"arr":"arr2"})"`:'stroke-dasharray="4 4"'} data-ev="${ev}" class="edge"/>`;
    if(amt){ const mx=(x1+x2)/2,my=(y1+y2)/2; out+=`<text x="${mx}" y="${my-6}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${col}" style="paint-order:stroke;stroke:var(--panel);stroke-width:4px">${amt}</text>`; } });
  g.nodes.forEach(n=>{ const r=rad(n);
    const shape = n.kind? `<rect x="${n.x-r}" y="${n.y-r}" width="${2*r}" height="${2*r}" rx="3" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.6"/>`
      : `<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${band(n.r)}" stroke="var(--panel)" stroke-width="2.5"/>`;
    out+=`<g class="node" data-id="${n.id}" tabindex="0">${shape}<text x="${n.x}" y="${n.y+r+15}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)" style="paint-order:stroke;stroke:var(--panel);stroke-width:4px">${n.id}</text></g>`; });
  svg.innerHTML=out;
  svg.querySelectorAll(".node").forEach(el=>{ const n=pos[el.dataset.id];
    el.onmousemove=e=>{ const a=ACCTS[n.id]; tip(e, n.kind?`<b>${n.id}</b><br>${n.kind==="dev"?"Device":"IP address"} shared by linked accounts`:`<b>${n.id}</b> · risk ${n.r}<br>${a?esc(a.name)+"<br>"+a.bank+" · "+a.country:"Synthetic account"}`); };
    el.onmouseleave=()=>tip(null);
    el.onpointerdown=e=>{ e.preventDefault(); el.setPointerCapture(e.pointerId); const pt=svg.createSVGPoint();
      const move=ev=>{ pt.x=ev.clientX; pt.y=ev.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse()); n.x=Math.max(20,Math.min(680,p.x)); n.y=Math.max(20,Math.min(410,p.y)); drawGraph(); };
      const up=()=>{ document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); };
      document.addEventListener("pointermove",move); document.addEventListener("pointerup",up); tip(null); };
  });
  svg.querySelectorAll(".edge").forEach(el=>{ if(!el.dataset.ev) return; el.style.cursor="pointer";
    el.onmousemove=e=>{ const ev=EV.find(x=>x.id===el.dataset.ev); tip(e,`<b>${ev.id}</b> ${esc(ev.summary)}`); }; el.onmouseleave=()=>tip(null);
    el.onclick=()=>showEvidence(el.dataset.ev); });
}

  <p class="note">${S.metricMode==="ring"?"A ring counts as found when ≥ 60% of its accounts land in one case. Precision below 1.0 comes from the planted decoys.":"Per-transaction labels from is_laundering and gt_pattern."}</p></div>
  <div>${rows.map(r=>`<div style="margin:6px 0 12px"><div style="font-size:13px;margin-bottom:4px">${r[0]}</div>${[["P",r[1],"var(--primary)"],["R",r[2],"var(--accent)"],["F1",r[3],"var(--low)"]].map(([l,v,col])=>`<div class="row" style="gap:6px;margin:2px 0"><span style="width:18px;font-size:11px;color:var(--muted)">${l}</span><div class="bar" style="flex:1;height:8px"><span style="width:${v*100}%;background:${col}"></span></div></div>`).join("")}</div>`).join("")}</div></div></div>
  <div class="card" style="margin-top:16px"><div class="row"><h2 style="margin:0">Audit log</h2><span class="pill" style="margin-left:8px"><i></i>Hash chain verified</span><span class="spacer"></span><button class="btn" onclick="exportCsv()">Export CSV</button></div>
  <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Time (UTC)</th><th>Actor</th><th>Action</th><th>Case</th><th>Change</th><th>Hash</th></tr></thead><tbody>
  ${S.audit.slice().reverse().map(a=>`<tr><td class="mono">${a.ts}</td><td>${a.actor}</td><td><b>${a.action}</b></td><td class="mono">${a.caseId}</td><td><details><summary class="note" style="cursor:pointer">before → after</summary><pre class="mono" style="white-space:pre-wrap !important;margin:6px 0 0">${esc(JSON.stringify(a.before))}\n→ ${esc(JSON.stringify(a.after))}</pre></details></td><td class="mono" title="prev ${a.prev}">${a.hash.slice(0,10)}…</td></tr>`).join("")}</tbody></table></div></div>`;
}
function exportCsv(){
  const lines=["ts,actor,action,case_id,before,after,prev_hash,row_hash",...S.audit.map(a=>[a.ts,a.actor,a.action,a.caseId,JSON.stringify(a.before),JSON.stringify(a.after),a.prev,a.hash].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))];
  const url=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"})); const a=document.createElement("a"); a.href=url; a.download="audit_log.csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ------------------------------------------------------------------ chrome */
function toast(msg){ const t=document.createElement("div"); t.textContent=msg; t.setAttribute("role","status");
  Object.assign(t.style,{position:"fixed",right:"20px",bottom:"calc(20px + env(safe-area-inset-bottom,0px))",background:"var(--ink)",color:"var(--surface)",padding:"10px 14px",borderRadius:"8px",fontSize:"14px",zIndex:60,maxWidth:"360px"});
  document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
$("#demoBtn").onclick=runDemo;
$("#injectToggle").onchange=e=>{ S.inject=e.target.checked;
  if(S.sar==="done"){ if(S.inject){ if(!S.narr.activity.some(s=>s.fake)) S.narr.activity.splice(2,0,{text:FAKE[0],ids:[...FAKE[1]],fake:true}); }
    else { S.narr.activity=S.narr.activity.filter(s=>!s.fake); }
    S.drafted["C-001"].g=validateAll(); if(S.inject){ S.page="investigate"; S.caseId="C-001"; S.tab="sar"; } render();
    toast(S.inject?"False sentence injected and re-validated.":"Injected sentence removed."); }
  else toast(S.inject?"Injection armed: the next draft will include a false sentence.":"Injection off."); };
$("#mockToggle").onchange=e=>{ S.mock=e.target.checked; const p=$("#llmpill"); p.className="pill"+(S.mock?" mock":""); p.innerHTML=`<i></i>${S.mock?"Mock mode · offline":"Gemini ✓ · Groq ✓"}`; if(S.page==="investigate") render(); };
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
$("#wireBtn").onclick=()=>{ S.wire=true; document.body.classList.add("wire"); $("#wireBtn").setAttribute("aria-pressed","true"); $("#hifiBtn").setAttribute("aria-pressed","false"); };
$("#hifiBtn").onclick=()=>{ S.wire=false; document.body.classList.remove("wire"); $("#hifiBtn").setAttribute("aria-pressed","true"); $("#wireBtn").setAttribute("aria-pressed","false"); };
render();
</script>

# RingSight theme: white-first. Colours mirror the LIGHT tokens in
# app/components/theme.py (the single source of colour). To ship dark, set
# THEME = "dark" there and swap these values for the DARK tokens together.
[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FA"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
